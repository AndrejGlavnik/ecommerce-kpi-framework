<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="eCommerce KPI report preview">
  <rect width="960" height="540" fill="#f7f8fb"/>
  <rect x="54" y="48" width="852" height="444" rx="8" fill="#ffffff" stroke="#dce3ea"/>
  <text x="86" y="100" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">eCommerce KPI Report</text>
  <text x="86" y="135" font-family="Arial, sans-serif" font-size="16" fill="#526071">Weighted period metrics · mock retailer and web data</text>
  <g font-family="Arial, sans-serif">
    <rect x="86" y="172" width="190" height="90" rx="8" fill="#eef4f8"/><text x="108" y="208" font-size="14" fill="#526071">Sessions</text><text x="108" y="240" font-size="30" font-weight="700" fill="#111827">5,800</text>
    <rect x="298" y="172" width="190" height="90" rx="8" fill="#eef4f8"/><text x="320" y="208" font-size="14" fill="#526071">Conversion rate</text><text x="320" y="240" font-size="30" font-weight="700" fill="#111827">3.66%</text>
    <rect x="510" y="172" width="190" height="90" rx="8" fill="#eef4f8"/><text x="532" y="208" font-size="14" fill="#526071">Revenue</text><text x="532" y="240" font-size="30" font-weight="700" fill="#111827">10,480</text>
    <rect x="722" y="172" width="152" height="90" rx="8" fill="#eef4f8"/><text x="744" y="208" font-size="14" fill="#526071">CTR</text><text x="744" y="240" font-size="30" font-weight="700" fill="#111827">5.31%</text>
  </g>
  <rect x="86" y="310" width="788" height="1" fill="#dce3ea"/>
  <text x="86" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">QA notes</text>
  <text x="86" y="388" font-family="Arial, sans-serif" font-size="15" fill="#526071">Conversion rate and AOV use weighted period calculations, not daily averages.</text>
  <text x="86" y="420" font-family="Arial, sans-serif" font-size="15" fill="#526071">Retailer sales may differ from web orders because timing and returns logic vary.</text>
</svg>
